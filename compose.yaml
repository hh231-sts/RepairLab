name: repairlab
services:
  db:
    image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: repairlab
      POSTGRES_PASSWORD: repairlab
      POSTGRES_DB: repairlab
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairlab"]
      interval: 3s
      timeout: 3s
      retries: 20
  # Run API/worker in WSL with the Docker CLI; daemon socket never enters agent containers.
volumes:
  postgres:
