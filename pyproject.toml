[project]
name = "repairlab"
version = "0.1.0"
description = "Local research issue repair platform with a durable, model-disabled harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "langgraph-checkpoint-sqlite>=3,<4", "pgvector>=0.4,<1", "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2", "mcp>=1.10,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
embedding = ["sentence-transformers>=3.4,<6"]
[project.scripts]
repairlab = "repairlab.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/repairlab"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires real PostgreSQL and/or Docker"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["backend/repairlab"]
check_untyped_defs = true
ignore_missing_imports = true
